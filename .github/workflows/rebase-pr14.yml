name: Verify rebased PR14

on:
  push:
    branches: [rebase/pr14-verifier-hardening]

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Regenerate exact legacy baseline
        run: |
          python3 checks/validate.py
          python3 checks/gen_index.py --check
          python3 checks/test_gen_metadata.py
          cd checks
          python3 gen.py
          cargo check --examples --target x86_64-unknown-linux-gnu --keep-going \
            --message-format=json > check.json 2> check.err || true
          python3 analyze.py check.json --emit-baseline > /tmp/baseline.txt
          {
            echo '# Exact known compile-suspect signatures for legacy `auto` examples.'
            echo '# Format: file :: section :: block N :: sorted(error-tokens)'
            echo '# Migration debt only; new, changed, and stale signatures fail CI.'
            echo
            cat /tmp/baseline.txt
          } > baseline.txt
          python3 analyze.py check.json \
            --check-baseline baseline.txt \
            --good-exceptions good-exceptions.txt
      - name: Run complete verifier
        run: bash checks/check.sh
      - name: Commit exact baseline if changed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add checks/baseline.txt
          git commit -m 'Regenerate exact legacy baseline after rebase'
          git push
