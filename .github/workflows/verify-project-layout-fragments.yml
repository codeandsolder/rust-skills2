name: Inventory remaining fragment contracts

on:
  push:
    branches: [fix/project-layout-fragments]

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Print remaining fragments
        run: |
          cd checks
          python3 gen.py
          python3 - <<'PY'
          import json

          manifest = json.load(open('manifest.json'))
          rows = [
              info for info in manifest.values()
              if info.get('expect') == 'fragment'
          ]
          rows.sort(key=lambda info: (info['file'], info['line'], info['section']))

          print(f'REMAINING_FRAGMENTS {len(rows)}')
          for info in rows:
              print(
                  f"{info['file']}\t{info['line']}\t{info['section']}\t{info.get('reason', '')}"
              )
          PY
