name: Migrate example expectations

on:
  push:
    branches: [checks/explicit-example-expectations]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: checks
      - name: Generate migration ledgers
        shell: bash
        run: |
          cd checks
          python3 gen.py
          cargo check --examples --target x86_64-unknown-linux-gnu --keep-going --message-format=json > check.json 2> check.err || true
          python3 analyze.py check.json --emit-baseline > baseline.txt
          {
            echo '# Exact known failures of examples whose expectation is `compile`.'
            echo '# Format: file :: section :: sorted(error-tokens) || reason'
            echo '# Migration debt only; new signatures fail and stale entries must be removed.'
            echo
            python3 analyze.py check.json --emit-good-exceptions
          } > good-exceptions.txt
      - name: Commit migration ledgers
        shell: bash
        run: |
          if git diff --quiet -- checks/baseline.txt checks/good-exceptions.txt; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add checks/baseline.txt checks/good-exceptions.txt
          git commit -m 'Split recommended-example debt from legacy baseline'
          git push
