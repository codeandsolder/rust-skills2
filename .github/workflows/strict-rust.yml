name: rust-skills2 strict CI gate

on:
  workflow_call:
    inputs:
      rust-toolchain:
        description: Dated nightly candidate; defaults to the checked-out gate pin.
        required: false
        type: string
        default: ""
      working-directory:
        description: Rust workspace directory relative to repository root.
        required: false
        type: string
        default: "."
      cargo-args:
        description: Space-separated Cargo selector arguments (package/features/target/target-kind/lock behavior).
        required: false
        type: string
        default: "--locked --workspace --all-targets"
      rust-targets:
        description: Comma-separated Rust compilation targets to install for cross-target selectors.
        required: false
        type: string
        default: ""
      checkout-submodules:
        description: "Submodule checkout mode passed to actions/checkout for the caller repository: false, true, or recursive."
        required: false
        type: string
        default: "false"
      apt-packages:
        description: Space-separated Ubuntu packages required to compile the selected workspace targets.
        required: false
        type: string
        default: ""
      ban-python-outside-ci:
        description: Reject tracked Python files outside CI-only paths. Enabled by default; Ruff + ty remain mandatory for permitted CI Python.
        required: false
        type: boolean
        default: true
      python-ci-paths:
        description: Additional repository-relative CI-only directory prefixes, one per line, used only when ban-python-outside-ci is enabled.
        required: false
        type: string
        default: ""
      allow-test-panics:
        description: Default test/bench panic ergonomics for selected packages; package/workspace metadata may override it while production stays strict.
        required: false
        type: boolean
        default: false
      dependency-quality:
        description: "Enable informational RustSec, unused-dependency and dependency-consolidation reporting; disable on redundant matrix legs"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  strict-rust:
    name: Strict Rust + Python policy
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","Linux","X64","local-ci"]') || 'ubuntu-24.04' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
          submodules: ${{ inputs.checkout-submodules }}

      - name: Checkout pinned rust-skills2 gate implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .rust-skills2-gate
          persist-credentials: false
          sparse-checkout: |
            /.github/actions/
            /scripts/
            /rust-toolchain.toml
            /policy-wasm/check.mjs
            /policy-wasm/run.mjs
            /policy-wasm/module.mjs
            /policy-wasm/module.json
            /policy-wasm/module.wasm.gz
          sparse-checkout-cone-mode: false

      - name: rust-skills2 strict Python gate
        uses: ./.rust-skills2-gate/.github/actions/python-strict
        with:
          ban-python-outside-ci: ${{ inputs.ban-python-outside-ci }}
          python-ci-paths: ${{ inputs.python-ci-paths }}

      - name: Enforce PR workflow supersession across all caller workflows
        uses: codeandsolder/ci-workflows/.github/actions/workflow-concurrency-policy@25d6a3701f7da8aaaf21821db2c49ead32fbdcf2 # main

      - name: Enforce canonical Rust CI caching
        uses: codeandsolder/ci-workflows/.github/actions/rust-ci-sccache-policy@25d6a3701f7da8aaaf21821db2c49ead32fbdcf2 # main
        with:
          strict-ref: ${{ job.workflow_sha }}

      - name: Quarantine newly introduced crates.io versions across all workspaces
        if: github.event_name == 'pull_request'
        uses: codeandsolder/ci-workflows/.github/actions/cargo-release-quarantine@25d6a3701f7da8aaaf21821db2c49ead32fbdcf2 # main
        with:
          base-ref: ${{ github.event.pull_request.base.sha }}
          lockfile: auto
          hours: "72"

      - name: Install native build dependencies
        if: ${{ inputs.apt-packages != '' }}
        env:
          PACKAGES: ${{ inputs.apt-packages }}
        shell: bash
        run: |
          sudo apt-get update
          read -r -a packages <<< "$PACKAGES"
          sudo apt-get install -y -- "${packages[@]}"

      - name: Resolve one quarantined compiler
        id: compiler
        uses: codeandsolder/ci-workflows/.github/actions/resolve-rust-toolchain@25d6a3701f7da8aaaf21821db2c49ead32fbdcf2 # main
        with:
          rust-toolchain: ${{ inputs.rust-toolchain }}

      - name: Install selected nightly Rust tools
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: ${{ steps.compiler.outputs.channel }}
          components: clippy,rustfmt
          targets: ${{ inputs.rust-targets }}

      - name: Setup mandatory sccache
        uses: codeandsolder/ci-workflows/.github/actions/setup-sccache@25d6a3701f7da8aaaf21821db2c49ead32fbdcf2 # main
        with:
          rust-toolchain: ${{ steps.compiler.outputs.channel }}
          rustflags: ""

      - name: Configure runner-local Cargo target
        shell: bash
        run: |
          set -euo pipefail
          target_dir="$RUNNER_TEMP/rust-skills2-target"
          mkdir -p "$target_dir"
          echo "CARGO_TARGET_DIR=$target_dir" >> "$GITHUB_ENV"

      - name: rust-skills2 strict gate
        uses: ./.rust-skills2-gate/.github/actions/rust-strict
        with:
          working-directory: ${{ inputs.working-directory }}
          cargo-args: ${{ inputs.cargo-args }}
          allow-test-panics: ${{ inputs.allow-test-panics }}
          rust-toolchain: ${{ steps.compiler.outputs.channel }}
          install-toolchain: "false"

      - name: Report dependency advisories, unused dependencies and consolidation
        if: inputs.dependency-quality
        uses: codeandsolder/ci-workflows/.github/actions/rust-dependency-quality@97afc778cf8ef00dca741a151885ad714a0f1230 # main
        with:
          working-directory: ${{ inputs.working-directory }}

      - name: Show Cargo future-incompatibility report
        if: failure()
        working-directory: ${{ inputs.working-directory }}
        shell: bash
        env:
          STRICT_TOOLCHAIN: ${{ steps.compiler.outputs.channel }}
        run: |
          cargo "+$STRICT_TOOLCHAIN" report future-incompatibilities || true


      - name: Finalize mandatory sccache
        if: always()
        uses: codeandsolder/ci-workflows/.github/actions/finalize-sccache@25d6a3701f7da8aaaf21821db2c49ead32fbdcf2 # main
