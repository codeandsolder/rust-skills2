name: rust-skills2 strict CI gate

on:
  workflow_call:
    inputs:
      working-directory:
        description: Rust workspace directory relative to repository root.
        required: false
        type: string
        default: "."
      cargo-args:
        description: Space-separated Cargo selector arguments (package/features/target/target-kind/lock behavior).
        required: false
        type: string
        default: "--locked --workspace --all-targets"
      checkout-submodules:
        description: "Submodule checkout mode passed to actions/checkout for the caller repository: false, true, or recursive."
        required: false
        type: string
        default: "false"
      apt-packages:
        description: Space-separated Ubuntu packages required to compile the selected workspace targets.
        required: false
        type: string
        default: ""
      ban-python-outside-ci:
        description: Reject tracked Python files outside CI-only paths. Enabled by default; Ruff + ty remain mandatory for permitted CI Python.
        required: false
        type: boolean
        default: true
      python-ci-paths:
        description: Additional repository-relative CI-only directory prefixes, one per line, used only when ban-python-outside-ci is enabled.
        required: false
        type: string
        default: ""
      allow-test-panics:
        description: Default test/bench panic ergonomics for selected packages; package/workspace metadata may override it while production stays strict.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  strict-rust:
    name: Strict Rust + Python policy
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","Linux","X64"]') || 'ubuntu-24.04' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
          submodules: ${{ inputs.checkout-submodules }}

      - name: Checkout pinned rust-skills2 gate implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .rust-skills2-gate
          persist-credentials: false
          sparse-checkout: |
            .github/actions
            scripts
          sparse-checkout-cone-mode: true

      - name: rust-skills2 strict Python gate
        uses: ./.rust-skills2-gate/.github/actions/python-strict
        with:
          ban-python-outside-ci: ${{ inputs.ban-python-outside-ci }}
          python-ci-paths: ${{ inputs.python-ci-paths }}

      - name: Enforce canonical Rust CI caching
        shell: bash
        env:
          EXPECTED_STRICT_REF: ${{ job.workflow_sha }}
        run: >-
          uv run --no-project --with pyyaml python
          .rust-skills2-gate/scripts/check_ci_sccache_policy.py
          --root "$GITHUB_WORKSPACE"
          --strict-ref "$EXPECTED_STRICT_REF"

      - name: Quarantine newly introduced crates.io versions across all workspaces
        if: github.event_name == 'pull_request'
        uses: codeandsolder/ci-workflows/.github/actions/cargo-release-quarantine@3a19d861aced60226c05c499fecc6761b66a6f49 # main
        with:
          base-ref: ${{ github.event.pull_request.base.sha }}
          lockfile: auto
          hours: "72"

      - name: Install native build dependencies
        if: ${{ inputs.apt-packages != '' }}
        env:
          PACKAGES: ${{ inputs.apt-packages }}
        shell: bash
        run: |
          sudo apt-get update
          read -r -a packages <<< "$PACKAGES"
          sudo apt-get install -y -- "${packages[@]}"

      - name: Install latest nightly Rust tools
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
          components: clippy,rustfmt

      - name: Setup mandatory sccache
        uses: codeandsolder/ci-workflows/.github/actions/setup-sccache@3a19d861aced60226c05c499fecc6761b66a6f49 # main
        with:
          rust-toolchain: nightly
          rustflags: ""

      - name: Configure runner-local Cargo target
        shell: bash
        run: |
          set -euo pipefail
          target_dir="$RUNNER_TEMP/rust-skills2-target"
          mkdir -p "$target_dir"
          echo "CARGO_TARGET_DIR=$target_dir" >> "$GITHUB_ENV"

      - name: rust-skills2 strict gate
        uses: ./.rust-skills2-gate/.github/actions/rust-strict
        with:
          working-directory: ${{ inputs.working-directory }}
          cargo-args: ${{ inputs.cargo-args }}
          allow-test-panics: ${{ inputs.allow-test-panics }}
          install-toolchain: "false"

      - name: Show Cargo future-incompatibility report
        if: failure()
        working-directory: ${{ inputs.working-directory }}
        shell: bash
        run: |
          cargo +nightly report future-incompatibilities || true


      - name: Finalize mandatory sccache
        if: always()
        uses: codeandsolder/ci-workflows/.github/actions/finalize-sccache@3a19d861aced60226c05c499fecc6761b66a6f49 # main
