name: rust-skills2 strict Rust gate

on:
  workflow_call:
    inputs:
      working-directory:
        description: Rust workspace directory relative to repository root.
        required: false
        type: string
        default: "."
      cargo-args:
        description: Space-separated Cargo selector arguments (package/features/target/target-kind/lock behavior).
        required: false
        type: string
        default: "--locked --workspace --all-targets"

permissions:
  contents: read

jobs:
  strict-rust:
    name: Strict nightly Rust policy
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install latest nightly Rust tools
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy,rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ inputs.working-directory }}
          shared-key: rust-skills2-nightly-strict
          cache-on-failure: true

      - name: rust-skills2 strict gate
        uses: codeandsolder/rust-skills2/.github/actions/rust-strict@main
        with:
          working-directory: ${{ inputs.working-directory }}
          cargo-args: ${{ inputs.cargo-args }}
          install-toolchain: "false"

      - name: Show Cargo future-incompatibility report
        if: failure()
        working-directory: ${{ inputs.working-directory }}
        shell: bash
        run: |
          cargo +nightly report future-incompatibilities || true
