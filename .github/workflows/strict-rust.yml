name: rust-skills2 strict CI gate

on:
  workflow_call:
    inputs:
      runner:
        description: JSON-encoded runs-on selector. Defaults to GitHub-hosted Ubuntu; private callers may opt into a self-hosted label set.
        required: false
        type: string
        default: '"ubuntu-24.04"'
      working-directory:
        description: Rust workspace directory relative to repository root.
        required: false
        type: string
        default: "."
      cargo-args:
        description: Space-separated Cargo selector arguments (package/features/target/target-kind/lock behavior).
        required: false
        type: string
        default: "--locked --workspace --all-targets"
      checkout-submodules:
        description: "Submodule checkout mode passed to actions/checkout for the caller repository: false, true, or recursive."
        required: false
        type: string
        default: "false"
      apt-packages:
        description: Space-separated Ubuntu packages required to compile the selected workspace targets.
        required: false
        type: string
        default: ""
      ban-python-outside-ci:
        description: Reject tracked Python files outside CI-only paths. Enabled by default; Ruff + ty remain mandatory for permitted CI Python.
        required: false
        type: boolean
        default: true
      python-ci-paths:
        description: Additional repository-relative CI-only directory prefixes, one per line, used only when ban-python-outside-ci is enabled.
        required: false
        type: string
        default: ""
      allow-test-panics:
        description: Default test/bench panic ergonomics for selected packages; package/workspace metadata may override it while production stays strict.
        required: false
        type: boolean
        default: false
      preserve-rustc-wrapper:
        description: Preserve an explicitly configured local/deterministic RUSTC_WRAPPER instead of clearing compiler wrappers.
        required: false
        type: boolean
        default: false
      rustc-wrapper:
        description: Optional explicit RUSTC_WRAPPER path used when preserve-rustc-wrapper is true.
        required: false
        type: string
        default: ""
      sccache-server-port:
        description: Optional existing sccache daemon port used when preserve-rustc-wrapper is true.
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  strict-rust:
    name: Strict Rust + Python policy
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: ${{ inputs.checkout-submodules }}

      - name: Checkout pinned rust-skills2 gate implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .rust-skills2-gate
          persist-credentials: false
          sparse-checkout: |
            .github/actions
            scripts
          sparse-checkout-cone-mode: true

      - name: rust-skills2 strict Python gate
        uses: ./.rust-skills2-gate/.github/actions/python-strict
        with:
          ban-python-outside-ci: ${{ inputs.ban-python-outside-ci }}
          python-ci-paths: ${{ inputs.python-ci-paths }}

      - name: Install native build dependencies
        if: ${{ inputs.apt-packages != '' }}
        env:
          PACKAGES: ${{ inputs.apt-packages }}
        shell: bash
        run: |
          sudo apt-get update
          read -r -a packages <<< "$PACKAGES"
          sudo apt-get install -y -- "${packages[@]}"

      - name: Install latest nightly Rust tools
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
          components: clippy,rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ${{ inputs.working-directory }}
          shared-key: rust-skills2-nightly-strict
          # Pull requests may restore the default-branch cache, but do not
          # persist branch-scoped copies. Renovate fan-out otherwise duplicates
          # ~550 MiB of target state per PR in every caller repository.
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: rust-skills2 strict gate
        uses: ./.rust-skills2-gate/.github/actions/rust-strict
        with:
          working-directory: ${{ inputs.working-directory }}
          cargo-args: ${{ inputs.cargo-args }}
          allow-test-panics: ${{ inputs.allow-test-panics }}
          preserve-rustc-wrapper: ${{ inputs.preserve-rustc-wrapper }}
          rustc-wrapper: ${{ inputs.rustc-wrapper }}
          sccache-server-port: ${{ inputs.sccache-server-port }}
          install-toolchain: "false"

      - name: Show Cargo future-incompatibility report
        if: failure()
        working-directory: ${{ inputs.working-directory }}
        shell: bash
        run: |
          cargo +nightly report future-incompatibilities || true
