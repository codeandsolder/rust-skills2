name: rust-skills2 strict Rust gate

on:
  workflow_call:
    inputs:
      working-directory:
        description: Rust workspace directory relative to repository root.
        required: false
        type: string
        default: "."
      cargo-args:
        description: Space-separated cargo clippy arguments.
        required: false
        type: string
        default: "--locked --workspace --all-targets"

permissions:
  contents: read

jobs:
  strict-rust:
    name: Strict nightly Rust policy
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install latest nightly Clippy
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy,rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-skills2-nightly-strict
          cache-on-failure: true

      - name: rust-skills2 strict gate
        uses: $/.github/actions/rust-strict
        with:
          working-directory: ${{ inputs.working-directory }}
          cargo-args: ${{ inputs.cargo-args }}
          install-toolchain: "false"
