name: Verify rebased PR12

on:
  push:
    branches: [rebase/pr12-error-doc]

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Regenerate and verify stable corpus
        run: |
          python3 checks/gen_index.py
          bash checks/check.sh
      - name: Smoke-test nightly try block
        run: |
          rustup toolchain install nightly --profile minimal --no-self-update
          cat > /tmp/try_block.rs <<'RS'
          #![feature(try_blocks)]
          use std::num::ParseIntError;
          fn report_pair(a: &str, b: &str) {
              let parsed: Result<(i32, i32), ParseIntError> = try {
                  (a.parse::<i32>()?, b.parse::<i32>()?)
              };
              println!("{parsed:?}");
          }
          fn main() { report_pair("10", "20"); }
          RS
          rustc +nightly --edition=2024 /tmp/try_block.rs -o /tmp/try_block
          /tmp/try_block
      - name: Commit generated state
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SKILL.md README.md checks/Cargo.lock
          git commit -m 'Regenerate index for rebased error guidance fixes'
          git push
