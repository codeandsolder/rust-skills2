name: Verify Tokio special contracts

on:
  push:
    branches: [fix/tokio-special-contracts]

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: checks -> target
      - name: Lock Tokio fixture
        run: cargo generate-lockfile --manifest-path checks/fixtures/tokio-special/Cargo.toml
      - name: Regenerate index
        run: python3 checks/gen_index.py
      - name: Run complete verifier
        run: bash checks/check.sh
      - name: Show contracts and ignores
        run: |
          cd checks
          python3 gen.py
          python3 - <<'PY'
          import json
          from collections import Counter

          manifest = json.load(open('manifest.json'))
          c = Counter(info['expect'] for info in manifest.values())
          print('COUNTS ' + ' '.join(f'{k}={c[k]}' for k in sorted(c)))
          ignores = sorted(
              (info['file'], info['line'], info['section'], info.get('reason', ''))
              for info in manifest.values()
              if info['expect'] == 'ignore'
          )
          print(f'REMAINING_IGNORES {len(ignores)}')
          for row in ignores:
              print('\t'.join(map(str, row)))
          PY
      - name: Commit generated state
        run: |
          if [[ -z "$(git status --porcelain -- SKILL.md checks/fixtures/tokio-special/Cargo.lock)" ]]; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- SKILL.md checks/fixtures/tokio-special/Cargo.lock
          git commit -m 'Lock Tokio special-contract fixture'
          git push
