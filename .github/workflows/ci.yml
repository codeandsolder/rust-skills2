name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Validate & compile-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: latest-known
          enable-cache: false
      # Toolchain/target are pinned by checks/rust-toolchain.toml (Rust 1.99.0).
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: checks
      # The exact same command contributors run locally.
      - name: Run checks
        env:
          # Exercise the relative-path contract permanently: check.sh must
          # normalize this before it changes cwd or dispatches fixture builds.
          CARGO_TARGET_DIR: checks/target
        run: bash checks/check.sh
      - name: Validate packed skill
        run: uv run --no-project python scripts/package_skill.py

  strict-gate-self-test:
    name: Strict reusable gate self-test
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Source-only lint policy action accepts generated-boundary fixture
        uses: ./.github/actions/source-lint-policy
        with:
          working-directory: checks/fixtures/strict-ci-generated-boundary

      - name: Python action accepts strict CI-only Python
        uses: ./.github/actions/python-strict
        env:
          RUST_SKILLS2_REPOSITORY_ROOT: ${{ github.workspace }}/checks/fixtures/strict-python-pass
        with:
          ban-python-outside-ci: "true"

      - name: Python gate resolves locked project dependencies without polluting the checkout
        shell: bash
        env:
          RUST_SKILLS2_REPOSITORY_ROOT: ${{ github.workspace }}/checks/fixtures/strict-python-project
          RUST_SKILLS2_PYTHON_ACTION_DIR: ${{ github.workspace }}/.github/actions/python-strict
          RUST_SKILLS2_BAN_PYTHON_OUTSIDE_CI: "true"
        run: bash scripts/strict_python.sh

      - name: Python location ban rejects non-CI Python by default
        shell: bash
        env:
          RUST_SKILLS2_REPOSITORY_ROOT: ${{ github.workspace }}/checks/fixtures/strict-python-outside-ci
          RUST_SKILLS2_PYTHON_ACTION_DIR: ${{ github.workspace }}/.github/actions/python-strict
        run: |
          set -euo pipefail
          if bash scripts/strict_python.sh; then
            echo "Python location gate unexpectedly accepted non-CI Python by default" >&2
            exit 1
          fi
          echo "Python location gate correctly rejected non-CI Python by default"

      - name: Python location ban can be explicitly disabled
        shell: bash
        env:
          RUST_SKILLS2_REPOSITORY_ROOT: ${{ github.workspace }}/checks/fixtures/strict-python-outside-ci
          RUST_SKILLS2_PYTHON_ACTION_DIR: ${{ github.workspace }}/.github/actions/python-strict
          RUST_SKILLS2_BAN_PYTHON_OUTSIDE_CI: "false"
        run: bash scripts/strict_python.sh

      - name: Python location ban rejects non-CI Python when enabled
        shell: bash
        env:
          RUST_SKILLS2_REPOSITORY_ROOT: ${{ github.workspace }}/checks/fixtures/strict-python-outside-ci
          RUST_SKILLS2_PYTHON_ACTION_DIR: ${{ github.workspace }}/.github/actions/python-strict
          RUST_SKILLS2_BAN_PYTHON_OUTSIDE_CI: "true"
        run: |
          set -euo pipefail
          if bash scripts/strict_python.sh; then
            echo "Python location gate unexpectedly accepted non-CI Python" >&2
            exit 1
          fi
          echo "Python location gate correctly rejected non-CI Python"

      - name: Ruff violations fail the Python gate
        shell: bash
        env:
          RUST_SKILLS2_REPOSITORY_ROOT: ${{ github.workspace }}/checks/fixtures/strict-python-blocked-ruff
          RUST_SKILLS2_PYTHON_ACTION_DIR: ${{ github.workspace }}/.github/actions/python-strict
          RUST_SKILLS2_BAN_PYTHON_OUTSIDE_CI: "true"
        run: |
          set -euo pipefail
          if bash scripts/strict_python.sh; then
            echo "Python gate unexpectedly accepted a Ruff violation" >&2
            exit 1
          fi
          echo "Python gate correctly rejected a Ruff violation"

      - name: ty violations fail the Python gate
        shell: bash
        env:
          RUST_SKILLS2_REPOSITORY_ROOT: ${{ github.workspace }}/checks/fixtures/strict-python-blocked-ty
          RUST_SKILLS2_PYTHON_ACTION_DIR: ${{ github.workspace }}/.github/actions/python-strict
          RUST_SKILLS2_BAN_PYTHON_OUTSIDE_CI: "true"
        run: |
          set -euo pipefail
          if bash scripts/strict_python.sh; then
            echo "Python gate unexpectedly accepted a ty violation" >&2
            exit 1
          fi
          echo "Python gate correctly rejected a ty violation"

      - name: Passing fixture
        uses: ./.github/actions/rust-strict
        with:
          working-directory: checks/fixtures/strict-ci-pass
          cargo-args: "--locked --all-targets"

      - name: Test panic ergonomics may be enabled without weakening production
        uses: ./.github/actions/rust-strict
        with:
          working-directory: checks/fixtures/strict-ci-test-panics
          cargo-args: "--locked --all-targets"
          allow-test-panics: "true"

      - name: Test panic ergonomics work for a binary-only crate
        uses: ./.github/actions/rust-strict
        with:
          working-directory: checks/fixtures/strict-ci-bin-test-panics
          cargo-args: "--locked --all-targets"
          allow-test-panics: "true"

      - name: Workspace members inherit strict policy with package test override
        uses: ./.github/actions/rust-strict
        with:
          working-directory: checks/fixtures/strict-ci-workspace-overrides
          cargo-args: "--locked --workspace --all-targets"

      - name: Workspace test default may be strengthened per package
        uses: ./.github/actions/rust-strict
        with:
          working-directory: checks/fixtures/strict-ci-workspace-default-panics
          cargo-args: "--locked --workspace --all-targets"

      - name: Package test override does not relax sibling workspace members
        shell: bash
        env:
          RUST_SKILLS2_WORKING_DIRECTORY: checks/fixtures/strict-ci-workspace-overrides-blocked
          RUST_SKILLS2_CARGO_ARGS: "--locked --workspace --all-targets"
          RUST_SKILLS2_ACTION_DIR: ${{ github.workspace }}/.github/actions/rust-strict
        run: |
          set -euo pipefail
          if bash scripts/strict_clippy.sh; then
            echo "package test override unexpectedly relaxed a strict sibling" >&2
            exit 1
          fi
          echo "package test override stayed scoped to its workspace member"

      - name: Test panic opt-in still rejects production expect
        shell: bash
        env:
          RUST_SKILLS2_WORKING_DIRECTORY: checks/fixtures/strict-ci-blocked-result-expect
          RUST_SKILLS2_CARGO_ARGS: "--locked --all-targets"
          RUST_SKILLS2_ALLOW_TEST_PANICS: "true"
          RUST_SKILLS2_ACTION_DIR: ${{ github.workspace }}/.github/actions/rust-strict
        run: |
          set -euo pipefail
          if bash scripts/strict_clippy.sh; then
            echo "test-panic opt-in unexpectedly relaxed production expect" >&2
            exit 1
          fi
          echo "test-panic opt-in preserved strict production policy"

      - name: Test panic opt-in still rejects correctness violations
        shell: bash
        env:
          RUST_SKILLS2_WORKING_DIRECTORY: checks/fixtures/strict-ci-test-correctness-blocked
          RUST_SKILLS2_CARGO_ARGS: "--locked --all-targets"
          RUST_SKILLS2_ALLOW_TEST_PANICS: "true"
          RUST_SKILLS2_ACTION_DIR: ${{ github.workspace }}/.github/actions/rust-strict
        run: |
          set -euo pipefail
          if bash scripts/strict_clippy.sh; then
            echo "test-panic opt-in unexpectedly relaxed clippy::correctness" >&2
            exit 1
          fi
          echo "test-panic opt-in preserved test correctness policy"

      - name: Reasoned large-enum performance tradeoff may stay inline
        uses: ./.github/actions/rust-strict
        with:
          working-directory: checks/fixtures/strict-ci-large-enum-expect
          cargo-args: "--locked --all-targets"

      - name: Explicit generated lint boundary may own generated-code expectations
        uses: ./.github/actions/rust-strict
        with:
          working-directory: checks/fixtures/strict-ci-generated-boundary
          cargo-args: "--locked --all-targets"

      - name: Generated lint boundary may not escape package root
        shell: bash
        env:
          RUST_SKILLS2_WORKING_DIRECTORY: checks/fixtures/strict-ci-blocked-generated-boundary
          RUST_SKILLS2_CARGO_ARGS: "--locked --all-targets"
          RUST_SKILLS2_ACTION_DIR: ${{ github.workspace }}/.github/actions/rust-strict
        run: |
          set -euo pipefail
          if bash scripts/strict_clippy.sh; then
            echo "strict gate unexpectedly accepted an escaping generated lint boundary" >&2
            exit 1
          fi
          echo "strict gate correctly rejected an escaping generated lint boundary"

      - name: Pure generated include wrapper may own generated-code lint scope
        uses: ./.github/actions/rust-strict
        with:
          working-directory: checks/fixtures/strict-ci-generated-wrapper
          cargo-args: "--locked --all-targets"

      - name: Generated lint boundary requires generated marker
        shell: bash
        env:
          RUST_SKILLS2_WORKING_DIRECTORY: checks/fixtures/strict-ci-blocked-generated-marker
          RUST_SKILLS2_CARGO_ARGS: "--locked --all-targets"
          RUST_SKILLS2_ACTION_DIR: ${{ github.workspace }}/.github/actions/rust-strict
        run: |
          set -euo pipefail
          if bash scripts/strict_clippy.sh; then
            echo "strict gate unexpectedly accepted an unmarked generated lint boundary" >&2
            exit 1
          fi
          echo "strict gate correctly rejected an unmarked generated lint boundary"

      - name: Generated lint boundary may not cover Cargo target root
        shell: bash
        env:
          RUST_SKILLS2_WORKING_DIRECTORY: checks/fixtures/strict-ci-blocked-generated-root
          RUST_SKILLS2_CARGO_ARGS: "--locked --all-targets"
          RUST_SKILLS2_ACTION_DIR: ${{ github.workspace }}/.github/actions/rust-strict
        run: |
          set -euo pipefail
          if bash scripts/strict_clippy.sh; then
            echo "strict gate unexpectedly accepted a generated Cargo target root" >&2
            exit 1
          fi
          echo "strict gate correctly rejected a generated Cargo target root"

      - name: Non-negotiable expectation must fail
        shell: bash
        env:
          RUST_SKILLS2_WORKING_DIRECTORY: checks/fixtures/strict-ci-blocked-expect
          RUST_SKILLS2_CARGO_ARGS: "--locked --all-targets"
          RUST_SKILLS2_ACTION_DIR: ${{ github.workspace }}/.github/actions/rust-strict
        run: |
          set -euo pipefail
          if bash scripts/strict_clippy.sh; then
            echo "strict gate unexpectedly accepted #[expect(clippy::unwrap_used)]" >&2
            exit 1
          fi
          echo "strict gate correctly rejected suppression of a non-negotiable lint"

      - name: Direct Result expect must fail
        shell: bash
        env:
          RUST_SKILLS2_WORKING_DIRECTORY: checks/fixtures/strict-ci-blocked-result-expect
          RUST_SKILLS2_CARGO_ARGS: "--locked --all-targets"
          RUST_SKILLS2_ACTION_DIR: ${{ github.workspace }}/.github/actions/rust-strict
        run: |
          set -euo pipefail
          if bash scripts/strict_clippy.sh; then
            echo "strict gate unexpectedly accepted Result::expect" >&2
            exit 1
          fi
          echo "strict gate correctly rejected Result::expect"

      - name: Correctness expectation must fail
        shell: bash
        env:
          RUST_SKILLS2_WORKING_DIRECTORY: checks/fixtures/strict-ci-blocked-group-expect
          RUST_SKILLS2_CARGO_ARGS: "--locked --all-targets"
          RUST_SKILLS2_ACTION_DIR: ${{ github.workspace }}/.github/actions/rust-strict
        run: |
          set -euo pipefail
          if bash scripts/strict_clippy.sh; then
            echo "strict gate unexpectedly accepted a correctness expectation" >&2
            exit 1
          fi
          echo "strict gate correctly rejected a correctness expectation"

      - name: Unreasoned expectation must fail
        shell: bash
        env:
          RUST_SKILLS2_WORKING_DIRECTORY: checks/fixtures/strict-ci-blocked-unreasoned-expect
          RUST_SKILLS2_CARGO_ARGS: "--locked --all-targets"
          RUST_SKILLS2_ACTION_DIR: ${{ github.workspace }}/.github/actions/rust-strict
        run: |
          set -euo pipefail
          if bash scripts/strict_clippy.sh; then
            echo "strict gate unexpectedly accepted an unreasoned expectation" >&2
            exit 1
          fi
          echo "strict gate correctly rejected an unreasoned expectation"

      - name: Multi-lint expectation must fail
        shell: bash
        env:
          RUST_SKILLS2_WORKING_DIRECTORY: checks/fixtures/strict-ci-blocked-multi-expect
          RUST_SKILLS2_CARGO_ARGS: "--locked --all-targets"
          RUST_SKILLS2_ACTION_DIR: ${{ github.workspace }}/.github/actions/rust-strict
        run: |
          set -euo pipefail
          if bash scripts/strict_clippy.sh; then
            echo "strict gate unexpectedly accepted a multi-lint expectation" >&2
            exit 1
          fi
          echo "strict gate correctly rejected a multi-lint expectation"

      - name: Reasoned handwritten allow must fail
        shell: bash
        env:
          RUST_SKILLS2_WORKING_DIRECTORY: checks/fixtures/strict-ci-reasoned-allow
          RUST_SKILLS2_CARGO_ARGS: "--locked --all-targets"
          RUST_SKILLS2_ACTION_DIR: ${{ github.workspace }}/.github/actions/rust-strict
        run: |
          set -euo pipefail
          if bash scripts/strict_clippy.sh; then
            echo "strict gate unexpectedly accepted reasoned #[allow(...)]" >&2
            exit 1
          fi
          echo "strict gate correctly rejected reasoned #[allow(...)]"

      - name: Cargo lint allow level must fail
        shell: bash
        env:
          RUST_SKILLS2_WORKING_DIRECTORY: checks/fixtures/strict-ci-blocked-cargo-allow
          RUST_SKILLS2_CARGO_ARGS: "--locked --all-targets"
          RUST_SKILLS2_ACTION_DIR: ${{ github.workspace }}/.github/actions/rust-strict
        run: |
          set -euo pipefail
          if bash scripts/strict_clippy.sh; then
            echo "strict gate unexpectedly accepted Cargo lint level = allow" >&2
            exit 1
          fi
          echo "strict gate correctly rejected Cargo lint level = allow"

      - name: Cargo rustflags lint allow must fail
        shell: bash
        env:
          RUST_SKILLS2_WORKING_DIRECTORY: checks/fixtures/strict-ci-blocked-rustflags-allow
          RUST_SKILLS2_CARGO_ARGS: "--locked --all-targets"
          RUST_SKILLS2_ACTION_DIR: ${{ github.workspace }}/.github/actions/rust-strict
        run: |
          set -euo pipefail
          if bash scripts/strict_clippy.sh; then
            echo "strict gate unexpectedly accepted Cargo rustflags -A" >&2
            exit 1
          fi
          echo "strict gate correctly rejected Cargo rustflags -A"

      - name: Unreasoned handwritten allow must fail
        shell: bash
        env:
          RUST_SKILLS2_WORKING_DIRECTORY: checks/fixtures/strict-ci-blocked-allow
          RUST_SKILLS2_CARGO_ARGS: "--locked --all-targets"
          RUST_SKILLS2_ACTION_DIR: ${{ github.workspace }}/.github/actions/rust-strict
        run: |
          set -euo pipefail
          if bash scripts/strict_clippy.sh; then
            echo "strict gate unexpectedly accepted unreasoned #[allow(...)]" >&2
            exit 1
          fi
          echo "strict gate correctly rejected unreasoned #[allow(...)]"

      - name: Handwritten warn must fail
        shell: bash
        env:
          RUST_SKILLS2_WORKING_DIRECTORY: checks/fixtures/strict-ci-blocked-warn
          RUST_SKILLS2_CARGO_ARGS: "--locked --all-targets"
          RUST_SKILLS2_ACTION_DIR: ${{ github.workspace }}/.github/actions/rust-strict
        run: |
          set -euo pipefail
          if bash scripts/strict_clippy.sh; then
            echo "strict gate unexpectedly accepted #[warn(...)]" >&2
            exit 1
          fi
          echo "strict gate correctly rejected #[warn(...)]"

      - name: Cargo cap-lints must fail
        shell: bash
        env:
          RUST_SKILLS2_WORKING_DIRECTORY: checks/fixtures/strict-ci-blocked-cap-lints
          RUST_SKILLS2_CARGO_ARGS: "--locked --all-targets"
          RUST_SKILLS2_ACTION_DIR: ${{ github.workspace }}/.github/actions/rust-strict
        run: |
          set -euo pipefail
          if bash scripts/strict_clippy.sh; then
            echo "strict gate unexpectedly accepted Cargo --cap-lints" >&2
            exit 1
          fi
          echo "strict gate correctly rejected Cargo --cap-lints"

      - name: Environment force-warn must fail
        shell: bash
        env:
          RUST_SKILLS2_WORKING_DIRECTORY: checks/fixtures/strict-ci-pass
          RUST_SKILLS2_CARGO_ARGS: "--locked --all-targets"
          RUST_SKILLS2_ACTION_DIR: ${{ github.workspace }}/.github/actions/rust-strict
          RUSTFLAGS: "--force-warn clippy::unwrap_used"
        run: |
          set -euo pipefail
          if bash scripts/strict_clippy.sh; then
            echo "strict gate unexpectedly accepted environment --force-warn" >&2
            exit 1
          fi
          echo "strict gate correctly rejected environment --force-warn"

      - name: Cargo argument config override must fail
        shell: bash
        env:
          RUST_SKILLS2_WORKING_DIRECTORY: checks/fixtures/strict-ci-pass
          RUST_SKILLS2_CARGO_ARGS: '--locked --all-targets --config build.rustflags=["--cap-lints=allow"]'
          RUST_SKILLS2_ACTION_DIR: ${{ github.workspace }}/.github/actions/rust-strict
        run: |
          set -euo pipefail
          if bash scripts/strict_clippy.sh; then
            echo "strict gate unexpectedly accepted cargo-args --config" >&2
            exit 1
          fi
          echo "strict gate correctly rejected cargo-args --config"

      - name: Cargo rustc separator injection must fail
        shell: bash
        env:
          RUST_SKILLS2_WORKING_DIRECTORY: checks/fixtures/strict-ci-pass
          RUST_SKILLS2_CARGO_ARGS: '--locked --all-targets -- -Aclippy::unwrap_used'
          RUST_SKILLS2_ACTION_DIR: ${{ github.workspace }}/.github/actions/rust-strict
        run: |
          set -euo pipefail
          if bash scripts/strict_clippy.sh; then
            echo "strict gate unexpectedly accepted cargo-args rustc injection" >&2
            exit 1
          fi
          echo "strict gate correctly rejected cargo-args rustc injection"

      - name: Cargo mutating fix mode must fail
        shell: bash
        env:
          RUST_SKILLS2_WORKING_DIRECTORY: checks/fixtures/strict-ci-pass
          RUST_SKILLS2_CARGO_ARGS: '--locked --all-targets --fix'
          RUST_SKILLS2_ACTION_DIR: ${{ github.workspace }}/.github/actions/rust-strict
        run: |
          set -euo pipefail
          if bash scripts/strict_clippy.sh; then
            echo "strict gate unexpectedly accepted cargo-args --fix" >&2
            exit 1
          fi
          echo "strict gate correctly rejected cargo-args --fix"

      - name: Cargo early-exit option must fail
        shell: bash
        env:
          RUST_SKILLS2_WORKING_DIRECTORY: checks/fixtures/strict-ci-pass
          RUST_SKILLS2_CARGO_ARGS: '--help'
          RUST_SKILLS2_ACTION_DIR: ${{ github.workspace }}/.github/actions/rust-strict
        run: |
          set -euo pipefail
          if bash scripts/strict_clippy.sh; then
            echo "strict gate unexpectedly accepted cargo-args --help" >&2
            exit 1
          fi
          echo "strict gate correctly rejected cargo-args --help"

      - name: Cargo package selector remains supported
        uses: ./.github/actions/rust-strict
        with:
          working-directory: checks/fixtures/strict-ci-pass
          cargo-args: "--locked --package strict-ci-pass --all-targets"

