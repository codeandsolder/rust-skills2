name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Validate & compile-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Enforce PR workflow supersession across all caller workflows
        uses: codeandsolder/ci-workflows/.github/actions/workflow-concurrency-policy@1293f1c247f07a14a85859f908b4f6b7e2553922 # main

      - name: Resolve one quarantined compiler
        id: compiler
        uses: codeandsolder/ci-workflows/.github/actions/resolve-rust-toolchain@1293f1c247f07a14a85859f908b4f6b7e2553922 # main
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: ${{ steps.compiler.outputs.channel }}
          targets: x86_64-unknown-linux-gnu,wasm32-wasip1
          components: clippy,rustfmt
      - name: Setup mandatory sccache
        uses: codeandsolder/ci-workflows/.github/actions/setup-sccache@1293f1c247f07a14a85859f908b4f6b7e2553922 # main
        with:
          rust-toolchain: ${{ steps.compiler.outputs.channel }}
          rustflags: ""
      - name: Verify mandatory dependency scan wiring
        run: node --test checks/dependency-quality-workflow.test.mjs checks/release-licenses.test.mjs
      # The exact same command contributors run locally.
      - name: Run checks
        env:
          # Exercise the relative-path contract permanently: check.sh must
          # normalize this before it changes cwd or dispatches fixture builds.
          CARGO_TARGET_DIR: checks/target
        run: bash checks/check.sh
      - name: Build portable source policy
        shell: bash
        run: |
          cargo test --locked --manifest-path policy-wasm/Cargo.toml --lib --bins --target-dir "$RUNNER_TEMP/source-policy"
          cargo build --locked --release --target wasm32-wasip1 --manifest-path policy-wasm/Cargo.toml --target-dir "$RUNNER_TEMP/source-policy"
      - name: Upload portable policy for cross-platform validation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: source-policy-wasm
          path: ${{ runner.temp }}/source-policy/wasm32-wasip1/release/source-policy.wasm
          if-no-files-found: error
      - name: Validate rebuilt and bundled policy
        shell: bash
        run: |
          cargo test --locked --manifest-path policy-wasm/Cargo.toml --test source_policy_golden --target-dir "$RUNNER_TEMP/source-policy"
          node --test policy-wasm/gitlink.test.mjs
          node --test policy-wasm/token-golden.test.mjs
          node checks/compare_workspace_policy.mjs "${{ steps.compiler.outputs.channel }}" "$RUNNER_TEMP/source-policy/wasm32-wasip1/release/source-policy.wasm"
          node policy-wasm/package.mjs verify "$RUNNER_TEMP/source-policy/wasm32-wasip1/release/source-policy.wasm" "${{ steps.compiler.outputs.channel }}"
          node checks/compare_workspace_policy.mjs "${{ steps.compiler.outputs.channel }}" policy-wasm/module.json
      - name: Strict lint portable policy
        shell: bash
        env:
          RUST_SKILLS2_WORKING_DIRECTORY: policy-wasm
          CARGO_TARGET_DIR: ${{ runner.temp }}/source-policy
        run: |
          bash scripts/strict_clippy.sh --toolchain "${{ steps.compiler.outputs.channel }}"

      - name: Strict lint native Rust CI tooling
        shell: bash
        env:
          RUST_SKILLS2_WORKING_DIRECTORY: checks/ci-tool
          CARGO_TARGET_DIR: ${{ runner.temp }}/ci-tool
        run: bash scripts/strict_clippy.sh --toolchain "${{ steps.compiler.outputs.channel }}"

      - name: Finalize mandatory sccache
        if: always()
        uses: codeandsolder/ci-workflows/.github/actions/finalize-sccache@1293f1c247f07a14a85859f908b4f6b7e2553922 # main

  cargo-release-age:
    if: github.event_name == 'pull_request'
    uses: codeandsolder/ci-workflows/.github/workflows/cargo-release-quarantine.yml@1293f1c247f07a14a85859f908b4f6b7e2553922 # main

  portable-source-policy:
    name: Portable source policy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Resolve one quarantined compiler
        id: compiler
        uses: codeandsolder/ci-workflows/.github/actions/resolve-rust-toolchain@1293f1c247f07a14a85859f908b4f6b7e2553922 # main
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: ${{ steps.compiler.outputs.channel }}
          components: clippy
      - name: Setup mandatory sccache
        uses: codeandsolder/ci-workflows/.github/actions/setup-sccache@1293f1c247f07a14a85859f908b4f6b7e2553922 # main
        with:
          rust-toolchain: ${{ steps.compiler.outputs.channel }}
          rustflags: ""
      - name: Native Rust rules and compiler evidence regression tests
        shell: bash
        run: cargo test --locked --manifest-path checks/ci-tool/Cargo.toml --target-dir "$RUNNER_TEMP/ci-tool"
      - name: Validate frozen Rust policy acceptance fixtures and Gitlink isolation
        shell: bash
        run: |
          cargo test --locked --manifest-path policy-wasm/Cargo.toml --test source_policy_golden --target-dir "$RUNNER_TEMP/source-policy-golden"
          node --test policy-wasm/gitlink.test.mjs
          node --test policy-wasm/token-golden.test.mjs
      - name: Validate the exact bundled artifact
        shell: bash
        run: |
          node checks/compare_workspace_policy.mjs "${{ steps.compiler.outputs.channel }}" policy-wasm/module.json

      - name: Finalize mandatory sccache
        if: always()
        uses: codeandsolder/ci-workflows/.github/actions/finalize-sccache@1293f1c247f07a14a85859f908b4f6b7e2553922 # main

  strict-gate-self-test:
    name: Strict reusable gate self-test
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2

      - name: Resolve one quarantined compiler
        id: compiler
        uses: codeandsolder/ci-workflows/.github/actions/resolve-rust-toolchain@1293f1c247f07a14a85859f908b4f6b7e2553922 # main

      - name: Source-only lint policy action accepts generated-boundary fixture
        uses: ./.github/actions/source-lint-policy
        with:
          working-directory: checks/fixtures/strict-ci-generated-boundary

      - name: Exercise the actual sparse provider checkout
        shell: bash
        run: |
          set -euo pipefail
          gate="$RUNNER_TEMP/sparse-rust-skills2-gate"
          git clone --shared --no-checkout "$GITHUB_WORKSPACE" "$gate"
          awk '$0 == "          sparse-checkout: |" { reading=1; next } reading && /^            / { sub(/^            /, ""); print; next } reading { exit }' .github/workflows/strict-rust.yml |
            git -C "$gate" sparse-checkout set --no-cone --stdin
          git -C "$gate" checkout --detach "$(git rev-parse HEAD)"
          test -f "$gate/scripts/strict_clippy.sh"
          test ! -e "$gate/scripts/workspace_test_policy.py"
          test -f "$gate/.github/actions/rust-strict/clippy.toml"
          test ! -e "$gate/policy-wasm/src"
          cd checks/fixtures/strict-ci-generated-boundary
          node "$gate/policy-wasm/check.mjs" "$gate/policy-wasm/module.json" "${{ steps.compiler.outputs.channel }}" false --all-targets

      - name: Python gate skips setup for a Rust-only checkout
        id: no-python
        uses: ./.github/actions/python-strict
        env:
          RUST_SKILLS2_REPOSITORY_ROOT: ${{ github.workspace }}/checks/fixtures/strict-ci-pass

      - name: Reject a broken Git inventory instead of skipping the gate
        shell: bash
        run: |
          set -euo pipefail
          broken="$(mktemp -d "$RUNNER_TEMP/python-index.XXXXXX")"
          trap 'rm -rf -- "$broken"' EXIT
          git init -q "$broken"
          printf invalid > "$broken/.git/index"
          if RUST_SKILLS2_REPOSITORY_ROOT="$broken" bash scripts/strict_python.sh --probe; then
            echo "Python gate accepted a broken Git index" >&2
            exit 1
          fi

      - name: Python action accepts strict CI-only Python
        id: python-present
        uses: ./.github/actions/python-strict
        env:
          RUST_SKILLS2_REPOSITORY_ROOT: ${{ github.workspace }}/checks/fixtures/strict-python-pass
        with:
          ban-python-outside-ci: "true"

      - name: Assert both Python inventory outcomes
        shell: bash
        run: |
          test "${{ steps.no-python.outputs.has-python }}" = false
          test "${{ steps.python-present.outputs.has-python }}" = true

      - name: Python gate resolves locked project dependencies without polluting the checkout
        shell: bash
        env:
          RUST_SKILLS2_REPOSITORY_ROOT: ${{ github.workspace }}/checks/fixtures/strict-python-project
          RUST_SKILLS2_PYTHON_ACTION_DIR: ${{ github.workspace }}/.github/actions/python-strict
          RUST_SKILLS2_BAN_PYTHON_OUTSIDE_CI: "true"
        run: bash scripts/strict_python.sh

      - name: Python location ban rejects non-CI Python by default
        shell: bash
        env:
          RUST_SKILLS2_REPOSITORY_ROOT: ${{ github.workspace }}/checks/fixtures/strict-python-outside-ci
          RUST_SKILLS2_PYTHON_ACTION_DIR: ${{ github.workspace }}/.github/actions/python-strict
        run: |
          set -euo pipefail
          if bash scripts/strict_python.sh; then
            echo "Python location gate unexpectedly accepted non-CI Python by default" >&2
            exit 1
          fi
          echo "Python location gate correctly rejected non-CI Python by default"

      - name: Python location ban can be explicitly disabled
        shell: bash
        env:
          RUST_SKILLS2_REPOSITORY_ROOT: ${{ github.workspace }}/checks/fixtures/strict-python-outside-ci
          RUST_SKILLS2_PYTHON_ACTION_DIR: ${{ github.workspace }}/.github/actions/python-strict
          RUST_SKILLS2_BAN_PYTHON_OUTSIDE_CI: "false"
        run: bash scripts/strict_python.sh

      - name: Python location ban rejects non-CI Python when enabled
        shell: bash
        env:
          RUST_SKILLS2_REPOSITORY_ROOT: ${{ github.workspace }}/checks/fixtures/strict-python-outside-ci
          RUST_SKILLS2_PYTHON_ACTION_DIR: ${{ github.workspace }}/.github/actions/python-strict
          RUST_SKILLS2_BAN_PYTHON_OUTSIDE_CI: "true"
        run: |
          set -euo pipefail
          if bash scripts/strict_python.sh; then
            echo "Python location gate unexpectedly accepted non-CI Python" >&2
            exit 1
          fi
          echo "Python location gate correctly rejected non-CI Python"

      - name: Ruff violations fail the Python gate
        shell: bash
        env:
          RUST_SKILLS2_REPOSITORY_ROOT: ${{ github.workspace }}/checks/fixtures/strict-python-blocked-ruff
          RUST_SKILLS2_PYTHON_ACTION_DIR: ${{ github.workspace }}/.github/actions/python-strict
          RUST_SKILLS2_BAN_PYTHON_OUTSIDE_CI: "true"
        run: |
          set -euo pipefail
          if bash scripts/strict_python.sh; then
            echo "Python gate unexpectedly accepted a Ruff violation" >&2
            exit 1
          fi
          echo "Python gate correctly rejected a Ruff violation"

      - name: ty violations fail the Python gate
        shell: bash
        env:
          RUST_SKILLS2_REPOSITORY_ROOT: ${{ github.workspace }}/checks/fixtures/strict-python-blocked-ty
          RUST_SKILLS2_PYTHON_ACTION_DIR: ${{ github.workspace }}/.github/actions/python-strict
          RUST_SKILLS2_BAN_PYTHON_OUTSIDE_CI: "true"
        run: |
          set -euo pipefail
          if bash scripts/strict_python.sh; then
            echo "Python gate unexpectedly accepted a ty violation" >&2
            exit 1
          fi
          echo "Python gate correctly rejected a ty violation"

      - name: Setup mandatory sccache
        uses: codeandsolder/ci-workflows/.github/actions/setup-sccache@1293f1c247f07a14a85859f908b4f6b7e2553922 # main
        with:
          rust-toolchain: ${{ steps.compiler.outputs.channel }}
          rustflags: ""

      - name: Split strict phases preserve the real gate and reject mismatched plans
        shell: bash
        env:
          RUST_SKILLS2_WORKING_DIRECTORY: checks/fixtures/strict-ci-pass
          RUST_SKILLS2_CARGO_ARGS: "--locked --all-targets"
          STRICT_TOOLCHAIN: ${{ steps.compiler.outputs.channel }}
        run: |
          set -euo pipefail
          plan_dir="$(mktemp -d "$RUNNER_TEMP/strict-phases.XXXXXX")"
          trap 'rm -rf -- "$plan_dir"' EXIT
          rustup component add --toolchain "$STRICT_TOOLCHAIN" rustfmt
          strict=(bash scripts/strict_clippy.sh --toolchain "$STRICT_TOOLCHAIN")
          "${strict[@]}" --phase format
          "${strict[@]}" --phase preflight --plan "$plan_dir/pass"
          if RUST_SKILLS2_CARGO_ARGS="--locked --lib" "${strict[@]}" --phase compile --plan "$plan_dir/pass"; then
            echo "Compilation accepted a plan from another selector" >&2
            exit 1
          fi
          if "${strict[@]}" --phase compile --plan "$plan_dir/absent"; then
            echo "Compilation accepted an absent plan" >&2
            exit 1
          fi
          "${strict[@]}" --phase compile --plan "$plan_dir/pass"
          if RUST_SKILLS2_WORKING_DIRECTORY=checks/fixtures/strict-ci-blocked-allow "${strict[@]}" --phase preflight --plan "$plan_dir/blocked"; then
            echo "Preflight accepted a forbidden source suppression" >&2
            exit 1
          fi
          test ! -e "$plan_dir/blocked"

      - name: Attribute notes and reasons pass
        uses: ./.github/actions/rust-strict
        with:
          working-directory: checks/fixtures/strict-ci-attribute-reasons
          cargo-args: "--locked --lib"

      - name: Attribute reasons remain mandatory in strict and relaxed tests
        shell: bash
        env:
          CARGO_TERM_COLOR: never
          RUST_SKILLS2_WORKING_DIRECTORY: checks/fixtures/strict-ci-attribute-reasons
          RUST_SKILLS2_CARGO_ARGS: "--locked --all-targets"
          RUST_SKILLS2_ACTION_DIR: ${{ github.workspace }}/.github/actions/rust-strict
        run: |
          set -euo pipefail
          for relaxation in false true; do
            if output=$(RUST_SKILLS2_ALLOW_TEST_PANICS="$relaxation" bash scripts/strict_clippy.sh 2>&1); then
              echo "attribute documentation unexpectedly passed (relaxed=$relaxation)" >&2
              exit 1
            fi
            printf '%s\n' "$output"
            [[ "$output" == *'error: `deprecated` attribute without note'* ]]
            [[ "$output" == *'error: `#[must_use]` attribute without a reason'* ]]
            [[ "$output" == *'requested on the command line with `-D clippy::deprecated-attributes-without-note`'* ]]
            [[ "$output" == *'requested on the command line with `-D clippy::must-use-without-reason`'* ]]
          done

      - name: Both attribute reason expectations are rejected
        shell: bash
        env:
          RUST_SKILLS2_WORKING_DIRECTORY: checks/fixtures/strict-ci-blocked-attribute-expect
          RUST_SKILLS2_ACTION_DIR: ${{ github.workspace }}/.github/actions/rust-strict
        run: |
          set -euo pipefail
          if output=$(bash scripts/strict_clippy.sh 2>&1); then
            echo "attribute documentation suppression unexpectedly passed" >&2
            exit 1
          fi
          printf '%s\n' "$output"
          [[ "$output" == *'suppressing clippy::deprecated_attributes_without_note would weaken suppression policy'* ]]
          [[ "$output" == *'suppressing clippy::must_use_without_reason would weaken suppression policy'* ]]

      - name: Passing fixture
        uses: ./.github/actions/rust-strict
        with:
          working-directory: checks/fixtures/strict-ci-pass
          cargo-args: "--locked --all-targets"

      - name: Test panic ergonomics may be enabled without weakening production
        uses: ./.github/actions/rust-strict
        with:
          working-directory: checks/fixtures/strict-ci-test-panics
          cargo-args: "--locked --all-targets"
          allow-test-panics: "true"

      - name: Test panic ergonomics work for a binary-only crate
        uses: ./.github/actions/rust-strict
        with:
          working-directory: checks/fixtures/strict-ci-bin-test-panics
          cargo-args: "--locked --all-targets"
          allow-test-panics: "true"

      - name: Workspace members inherit strict policy with package test override
        uses: ./.github/actions/rust-strict
        with:
          working-directory: checks/fixtures/strict-ci-workspace-overrides
          cargo-args: "--locked --workspace --all-targets"

      - name: Workspace test default may be strengthened per package
        uses: ./.github/actions/rust-strict
        with:
          working-directory: checks/fixtures/strict-ci-workspace-default-panics
          cargo-args: "--locked --workspace --all-targets"

      - name: Package test override does not relax sibling workspace members
        shell: bash
        env:
          RUST_SKILLS2_WORKING_DIRECTORY: checks/fixtures/strict-ci-workspace-overrides-blocked
          RUST_SKILLS2_CARGO_ARGS: "--locked --workspace --all-targets"
          RUST_SKILLS2_ACTION_DIR: ${{ github.workspace }}/.github/actions/rust-strict
        run: |
          set -euo pipefail
          if bash scripts/strict_clippy.sh; then
            echo "package test override unexpectedly relaxed a strict sibling" >&2
            exit 1
          fi
          echo "package test override stayed scoped to its workspace member"

      - name: Test panic opt-in still rejects production expect
        shell: bash
        env:
          RUST_SKILLS2_WORKING_DIRECTORY: checks/fixtures/strict-ci-blocked-result-expect
          RUST_SKILLS2_CARGO_ARGS: "--locked --all-targets"
          RUST_SKILLS2_ALLOW_TEST_PANICS: "true"
          RUST_SKILLS2_ACTION_DIR: ${{ github.workspace }}/.github/actions/rust-strict
        run: |
          set -euo pipefail
          if bash scripts/strict_clippy.sh; then
            echo "test-panic opt-in unexpectedly relaxed production expect" >&2
            exit 1
          fi
          echo "test-panic opt-in preserved strict production policy"

      - name: Test panic opt-in still rejects correctness violations
        shell: bash
        env:
          RUST_SKILLS2_WORKING_DIRECTORY: checks/fixtures/strict-ci-test-correctness-blocked
          RUST_SKILLS2_CARGO_ARGS: "--locked --all-targets"
          RUST_SKILLS2_ALLOW_TEST_PANICS: "true"
          RUST_SKILLS2_ACTION_DIR: ${{ github.workspace }}/.github/actions/rust-strict
        run: |
          set -euo pipefail
          if bash scripts/strict_clippy.sh; then
            echo "test-panic opt-in unexpectedly relaxed clippy::correctness" >&2
            exit 1
          fi
          echo "test-panic opt-in preserved test correctness policy"

      - name: Reasoned large-enum performance tradeoff may stay inline
        uses: ./.github/actions/rust-strict
        with:
          working-directory: checks/fixtures/strict-ci-large-enum-expect
          cargo-args: "--locked --all-targets"

      - name: Explicit generated lint boundary may own generated-code expectations
        uses: ./.github/actions/rust-strict
        with:
          working-directory: checks/fixtures/strict-ci-generated-boundary
          cargo-args: "--locked --all-targets"

      - name: Generated lint boundary may not escape package root
        shell: bash
        env:
          RUST_SKILLS2_WORKING_DIRECTORY: checks/fixtures/strict-ci-blocked-generated-boundary
          RUST_SKILLS2_CARGO_ARGS: "--locked --all-targets"
          RUST_SKILLS2_ACTION_DIR: ${{ github.workspace }}/.github/actions/rust-strict
        run: |
          set -euo pipefail
          if bash scripts/strict_clippy.sh; then
            echo "strict gate unexpectedly accepted an escaping generated lint boundary" >&2
            exit 1
          fi
          echo "strict gate correctly rejected an escaping generated lint boundary"

      - name: Pure generated include wrapper may own generated-code lint scope
        uses: ./.github/actions/rust-strict
        with:
          working-directory: checks/fixtures/strict-ci-generated-wrapper
          cargo-args: "--locked --all-targets"

      - name: Generated lint boundary requires generated marker
        shell: bash
        env:
          RUST_SKILLS2_WORKING_DIRECTORY: checks/fixtures/strict-ci-blocked-generated-marker
          RUST_SKILLS2_CARGO_ARGS: "--locked --all-targets"
          RUST_SKILLS2_ACTION_DIR: ${{ github.workspace }}/.github/actions/rust-strict
        run: |
          set -euo pipefail
          if bash scripts/strict_clippy.sh; then
            echo "strict gate unexpectedly accepted an unmarked generated lint boundary" >&2
            exit 1
          fi
          echo "strict gate correctly rejected an unmarked generated lint boundary"

      - name: Generated lint boundary may not cover Cargo target root
        shell: bash
        env:
          RUST_SKILLS2_WORKING_DIRECTORY: checks/fixtures/strict-ci-blocked-generated-root
          RUST_SKILLS2_CARGO_ARGS: "--locked --all-targets"
          RUST_SKILLS2_ACTION_DIR: ${{ github.workspace }}/.github/actions/rust-strict
        run: |
          set -euo pipefail
          if bash scripts/strict_clippy.sh; then
            echo "strict gate unexpectedly accepted a generated Cargo target root" >&2
            exit 1
          fi
          echo "strict gate correctly rejected a generated Cargo target root"

      - name: Non-negotiable expectation must fail
        shell: bash
        env:
          RUST_SKILLS2_WORKING_DIRECTORY: checks/fixtures/strict-ci-blocked-expect
          RUST_SKILLS2_CARGO_ARGS: "--locked --all-targets"
          RUST_SKILLS2_ACTION_DIR: ${{ github.workspace }}/.github/actions/rust-strict
        run: |
          set -euo pipefail
          if bash scripts/strict_clippy.sh; then
            echo "strict gate unexpectedly accepted #[expect(clippy::unwrap_used)]" >&2
            exit 1
          fi
          echo "strict gate correctly rejected suppression of a non-negotiable lint"

      - name: Direct Result expect must fail
        shell: bash
        env:
          RUST_SKILLS2_WORKING_DIRECTORY: checks/fixtures/strict-ci-blocked-result-expect
          RUST_SKILLS2_CARGO_ARGS: "--locked --all-targets"
          RUST_SKILLS2_ACTION_DIR: ${{ github.workspace }}/.github/actions/rust-strict
        run: |
          set -euo pipefail
          if bash scripts/strict_clippy.sh; then
            echo "strict gate unexpectedly accepted Result::expect" >&2
            exit 1
          fi
          echo "strict gate correctly rejected Result::expect"

      - name: Correctness expectation must fail
        shell: bash
        env:
          RUST_SKILLS2_WORKING_DIRECTORY: checks/fixtures/strict-ci-blocked-group-expect
          RUST_SKILLS2_CARGO_ARGS: "--locked --all-targets"
          RUST_SKILLS2_ACTION_DIR: ${{ github.workspace }}/.github/actions/rust-strict
        run: |
          set -euo pipefail
          if bash scripts/strict_clippy.sh; then
            echo "strict gate unexpectedly accepted a correctness expectation" >&2
            exit 1
          fi
          echo "strict gate correctly rejected a correctness expectation"

      - name: Unreasoned expectation must fail
        shell: bash
        env:
          RUST_SKILLS2_WORKING_DIRECTORY: checks/fixtures/strict-ci-blocked-unreasoned-expect
          RUST_SKILLS2_CARGO_ARGS: "--locked --all-targets"
          RUST_SKILLS2_ACTION_DIR: ${{ github.workspace }}/.github/actions/rust-strict
        run: |
          set -euo pipefail
          if bash scripts/strict_clippy.sh; then
            echo "strict gate unexpectedly accepted an unreasoned expectation" >&2
            exit 1
          fi
          echo "strict gate correctly rejected an unreasoned expectation"

      - name: Multi-lint expectation must fail
        shell: bash
        env:
          RUST_SKILLS2_WORKING_DIRECTORY: checks/fixtures/strict-ci-blocked-multi-expect
          RUST_SKILLS2_CARGO_ARGS: "--locked --all-targets"
          RUST_SKILLS2_ACTION_DIR: ${{ github.workspace }}/.github/actions/rust-strict
        run: |
          set -euo pipefail
          if bash scripts/strict_clippy.sh; then
            echo "strict gate unexpectedly accepted a multi-lint expectation" >&2
            exit 1
          fi
          echo "strict gate correctly rejected a multi-lint expectation"

      - name: Reasoned handwritten allow must fail
        shell: bash
        env:
          RUST_SKILLS2_WORKING_DIRECTORY: checks/fixtures/strict-ci-reasoned-allow
          RUST_SKILLS2_CARGO_ARGS: "--locked --all-targets"
          RUST_SKILLS2_ACTION_DIR: ${{ github.workspace }}/.github/actions/rust-strict
        run: |
          set -euo pipefail
          if bash scripts/strict_clippy.sh; then
            echo "strict gate unexpectedly accepted reasoned #[allow(...)]" >&2
            exit 1
          fi
          echo "strict gate correctly rejected reasoned #[allow(...)]"

      - name: Cargo lint allow level must fail
        shell: bash
        env:
          RUST_SKILLS2_WORKING_DIRECTORY: checks/fixtures/strict-ci-blocked-cargo-allow
          RUST_SKILLS2_CARGO_ARGS: "--locked --all-targets"
