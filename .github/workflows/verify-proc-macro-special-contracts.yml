name: Verify proc-macro special contracts

on:
  push:
    branches: [fix/proc-macro-special-contracts]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: checks -> target
      - name: Regenerate index
        run: python3 checks/gen_index.py
      - name: Run complete verifier
        run: bash checks/check.sh
      - name: Show contract inventory
        run: |
          cd checks
          python3 gen.py
          python3 - <<'PY'
          import json
          from collections import Counter

          manifest = json.load(open('manifest.json'))
          counts = Counter(info['expect'] for info in manifest.values())
          print('COUNTS ' + ' '.join(f'{key}={counts[key]}' for key in sorted(counts)))
          fixture_rows = sorted(
              (info['file'], info['line'], info['section'], info['expect'])
              for info in manifest.values()
              if info['expect'].startswith('fixture:')
          )
          print(f'FIXTURE_BLOCKS {len(fixture_rows)}')
          for row in fixture_rows:
              print('\t'.join(map(str, row)))
          PY
