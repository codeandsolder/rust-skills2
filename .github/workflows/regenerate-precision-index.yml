name: Regenerate precision index

on:
  push:
    branches: [fix/precision-and-api-guidance]

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Regenerate index and repair README fork metadata
        shell: bash
        run: |
          python3 checks/gen_index.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          s = p.read_text()
          s = s.replace('instead of loading all 218', 'instead of loading all 324')
          s = s.replace('leonardomso/rust-skills', 'codeandsolder/rust-skills2')
          s = s.replace('raw.githubusercontent.com/codeandsolder/rust-skills2/master/SKILL.md', 'raw.githubusercontent.com/codeandsolder/rust-skills2/main/SKILL.md')
          p.write_text(s)
          PY
      - name: Commit generated files
        shell: bash
        run: |
          if git diff --quiet -- SKILL.md README.md; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- SKILL.md README.md
          git commit -m 'Regenerate rule index and README metadata'
          git push
