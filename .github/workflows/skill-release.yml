name: Package skill

on:
  pull_request:
    paths:
      - SKILL.md
      - LICENSE
      - "rules/**"
      - "skill-pack/**"
      - rust-toolchain.toml
      - .gitattributes
      - ".github/actions/rust-strict/**"
      - "policy-wasm/**"
      - scripts/strict_clippy.sh
      - scripts/toolchain-pin.sh
      - .github/workflows/skill-release.yml
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    name: Build packed skill
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Resolve one quarantined compiler
        id: compiler
        uses: codeandsolder/ci-workflows/.github/actions/resolve-rust-toolchain@5b72e3865937d6e85e9ea485af9d04ec83343c5f # main
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: ${{ steps.compiler.outputs.channel }}
          targets: wasm32-wasip1
          components: clippy,rustfmt
      - name: Setup mandatory sccache
        uses: codeandsolder/ci-workflows/.github/actions/setup-sccache@5b72e3865937d6e85e9ea485af9d04ec83343c5f # main
        with:
          rust-toolchain: ${{ steps.compiler.outputs.channel }}
          rustflags: ""
      - name: Build and test the portable skill packer
        shell: bash
        run: |
          cargo test --locked --manifest-path skill-pack/Cargo.toml --target-dir "$RUNNER_TEMP/skill-pack-target"
          cargo build --locked --release --target wasm32-wasip1 --manifest-path skill-pack/Cargo.toml --target-dir "$RUNNER_TEMP/skill-pack-target"
          node skill-pack/test.mjs "$RUNNER_TEMP/skill-pack-target/wasm32-wasip1/release/skill-pack.wasm"
          node skill-pack/run.mjs "$RUNNER_TEMP/skill-pack-target/wasm32-wasip1/release/skill-pack.wasm" . dist
      - name: Strict lint skill packer
        uses: ./.github/actions/rust-strict
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/skill-pack-target
        with:
          working-directory: skill-pack
          rust-toolchain: ${{ steps.compiler.outputs.channel }}
          install-toolchain: "false"
      - name: Upload portable packer for validation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: skill-pack-wasm
          path: ${{ runner.temp }}/skill-pack-target/wasm32-wasip1/release/skill-pack.wasm
          if-no-files-found: error
      - name: Upload packed skill artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rust-skills-package
          path: |
            dist/rust-skills.zip
            dist/rust-skills.skill
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Finalize mandatory sccache
        if: always()
        uses: codeandsolder/ci-workflows/.github/actions/finalize-sccache@5b72e3865937d6e85e9ea485af9d04ec83343c5f # main

  portable:
    name: Portable skill package (${{ matrix.os }})
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: skill-pack-wasm
          path: ${{ runner.temp }}/skill-pack-wasm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: rust-skills-package
          path: ${{ runner.temp }}/skill-pack-reference
      - name: Compare exact package bytes with Linux
        shell: bash
        run: |
          node skill-pack/test.mjs "$RUNNER_TEMP/skill-pack-wasm/skill-pack.wasm"
          node skill-pack/run.mjs "$RUNNER_TEMP/skill-pack-wasm/skill-pack.wasm" . "$RUNNER_TEMP/skill-pack-check"
          for name in rust-skills.zip rust-skills.skill SHA256SUMS; do
            cmp "$RUNNER_TEMP/skill-pack-reference/$name" "$RUNNER_TEMP/skill-pack-check/$name"
          done

  release:
    name: Attach package to GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package, portable]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packed skill artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: rust-skills-package
          path: dist
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          assets=(
            dist/rust-skills.zip
            dist/rust-skills.skill
            dist/SHA256SUMS
          )

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" \
              --verify-tag \
              --generate-notes \
              --title "$tag"
          fi
