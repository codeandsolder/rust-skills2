name: Rust stable release queue

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  queue-rust-release-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Detect current stable Rust and queue a review
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$({
            curl -fsSL https://static.rust-lang.org/dist/channel-rust-stable.toml
          } | python3 -c 'import sys, tomllib; print(tomllib.load(sys.stdin.buffer)["pkg"]["rust"]["version"].split()[0])')"

          test -n "$VERSION"
          echo "Current stable Rust: $VERSION"

          gh label create "automation:rust-release" \
            --repo "$REPO" \
            --color "8250df" \
            --description "Queued automatically when stable Rust changes" \
            --force

          MARKER="rust-stable:${VERSION}"
          EXISTING="$(gh issue list \
            --repo "$REPO" \
            --state all \
            --limit 200 \
            --search "${MARKER} in:body" \
            --json number \
            --jq '.[0].number // empty')"

          if [[ -n "$EXISTING" ]]; then
            echo "Rust $VERSION review already exists as issue #$EXISTING"
            exit 0
          fi

          BODY="$(cat <<EOF
          <!-- ${MARKER} -->
          <!-- automation-queue:rust-release -->

          Rust **${VERSION}** is now the stable toolchain.

          Do a complete review of this repository against the new stable release rather than only changing a version string:

          - Read the official Rust ${VERSION} release announcement and detailed release notes/changelog.
          - Review relevant rustc, Cargo, Clippy, rustfmt, standard-library, language, and tooling changes.
          - Re-read the repository's Rust guidance (`SKILL.md`, rules, checks, README, examples, and CI) for advice that is now stale, unnecessarily conservative, or missing a newly preferred idiom/tool.
          - Update recommendations and examples to current best practice where the new stable release changes what we should teach or generate.
          - Update CI/tooling assumptions where appropriate.
          - Run the repository checks and fix fallout.
          - If the release genuinely requires no repository changes, document what was reviewed and close this issue as a no-op.

          This issue is generated automatically. A ChatGPT maintenance automation is expected to implement it.
          EOF
          )"

          gh issue create \
            --repo "$REPO" \
            --title "Rust ${VERSION}: full best-practices refresh" \
            --label "automation:rust-release" \
            --body "$BODY"
