name: Verify rebased PR11

on:
  push:
    branches: [rebase/pr11-core-guidance]

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Regenerate and verify
        run: |
          python3 checks/gen_index.py
          bash checks/check.sh
      - name: Commit generated state
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SKILL.md README.md checks/Cargo.lock
          git commit -m 'Regenerate index for rebased core guidance fixes'
          git push
