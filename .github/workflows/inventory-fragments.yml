name: Migrate simple fragment contracts

on:
  push:
    branches: [fix/fragment-contracts-1]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Tighten simple fragment contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('rules')

          def lines(*xs):
              return '\n'.join(xs)

          def replace(path, old, new, count=1):
              p = root / path
              text = p.read_text()
              found = text.count(old)
              if found != count:
                  raise SystemExit(f'{path}: expected {count} replacement target(s), found {found}')
              p.write_text(text.replace(old, new, count))

          # These fragments already compile cleanly under the Rust 1.98 harness.
          replace('anti-stringly-typed.md', '<!-- rust-check: fragment; reason=requires serde derive dependency/features in the consuming crate -->', '<!-- rust-check: compile -->')
          replace('api-newtype-safety.md', '<!-- rust-check: fragment; reason=requires serde derive dependency/features in the consuming crate -->', '<!-- rust-check: compile -->')
          replace('doc-cfg-patterns.md', '<!-- rust-check: fragment; reason=crate-root inner attribute intended for a docs.rs nightly rustdoc build -->', '<!-- rust-check: compile -->')

          # Replace non_exhaustive pseudocode with a concrete wildcard match.
          replace('api-non-exhaustive.md', '<!-- rust-check: fragment; reason=extraction artifact: wrapper/context -->', '<!-- rust-check: compile -->')
          replace(
              'api-non-exhaustive.md',
              lines(
                  '// Downstream code MUST have wildcard',
                  'match error.kind() {',
                  '    ErrorKind::NotFound => ...,',
                  '    ErrorKind::PermissionDenied => ...,',
                  '    ErrorKind::TimedOut => ...,',
                  '    _ => ...,  // Required by non_exhaustive',
                  '}',
              ),
              lines(
                  '// Downstream code must leave room for future variants. A wildcard is',
                  '// accepted here too, even though this standalone example defines the enum locally.',
                  "fn describe_external(kind: ErrorKind) -> &'static str {",
                  '    match kind {',
                  '        ErrorKind::NotFound => "not found",',
                  '        ErrorKind::PermissionDenied => "permission denied",',
                  '        ErrorKind::TimedOut => "timed out",',
                  '        _ => "other",',
                  '    }',
                  '}',
              ),
          )

          # Make the documented panic example standalone instead of extracting a method.
          replace('doc-panics-section.md', '<!-- rust-check: fragment; reason=extraction artifact: wrapper/context -->', '<!-- rust-check: compile -->')
          replace(
              'doc-panics-section.md',
              lines(
                  '/// Panics if `index` is out of bounds (i.e., `index >= self.len()`).',
                  '///',
                  '/// # Examples',
                  '///',
                  '/// ```',
                  '/// let v = vec![1, 2, 3];',
                  '/// assert_eq!(v.get(1), &2);',
                  '/// ```',
                  'pub fn get(&self, index: usize) -> &T {',
                  '    &self.data[index]',
                  '}',
              ),
              lines(
                  '/// Panics if `index` is out of bounds (i.e., `index >= data.len()`).',
                  '///',
                  '/// # Examples',
                  '///',
                  '/// ```',
                  '/// let v = vec![1, 2, 3];',
                  '/// assert_eq!(get(&v, 1), &2);',
                  '/// ```',
                  'pub fn get<T>(data: &[T], index: usize) -> &T {',
                  '    &data[index]',
                  '}',
              ),
          )

          # Test-layout examples should be real Rust, not literal ellipses.
          replace('test-cfg-test-module.md', '<!-- rust-check: fragment; reason=test-layout pseudocode intentionally omits surrounding definitions -->', '<!-- rust-check: compile -->')
          replace(
              'test-cfg-test-module.md',
              lines(
                  '// Tests without cfg(test) - compiled into release binary',
                  'mod tests {',
                  '    #[test]',
                  '    fn test_something() { ... }  // Included in release build!',
                  '}',
                  '',
                  '// Tests in separate file without access to private items',
                  '// src/my_module.rs',
                  'fn private_helper() { ... }',
                  '',
                  '// tests/my_module_test.rs',
                  "// Can't access private_helper!",
              ),
              lines(
                  '// Tests without cfg(test) - the module itself is part of normal builds.',
                  'mod tests {',
                  '    #[test]',
                  '    fn test_something() {',
                  '        assert_eq!(2 + 2, 4);',
                  '    }',
                  '}',
                  '',
                  '// A private helper in a library module is not accessible from an external',
                  '// integration-test crate merely because the test lives under tests/.',
                  'fn private_helper() -> i32 { 42 }',
              ),
          )

          # Turn the two headline naming examples into concrete tests.
          replace('test-descriptive-names.md', '<!-- rust-check: fragment; reason=test-name pseudocode intentionally omits surrounding definitions -->', '<!-- rust-check: compile -->')
          replace(
              'test-descriptive-names.md',
              lines(
                  '#[test]',
                  'fn test1() { ... }',
                  '',
                  '#[test]',
                  'fn test_parse() { ... }  // Parse what? What behavior?',
                  '',
                  '#[test]',
                  'fn it_works() { ... }',
                  '',
                  '#[test]',
                  'fn test_function() { ... }',
              ),
              lines(
                  '#[test]',
                  'fn test1() { assert!(true); }',
                  '',
                  '#[test]',
                  'fn test_parse() { assert!(true); }  // Parse what? What behavior?',
                  '',
                  '#[test]',
                  'fn it_works() { assert!(true); }',
                  '',
                  '#[test]',
                  'fn test_function() { assert!(true); }',
              ),
          )
          replace('test-descriptive-names.md', '<!-- rust-check: fragment; reason=extraction artifact: wrapper/context -->', '<!-- rust-check: compile -->')
          replace(
              'test-descriptive-names.md',
              lines(
                  '#[test]',
                  'fn parse_returns_error_for_empty_input() { ... }',
                  '',
                  '#[test]',
                  'fn parse_handles_unicode_characters() { ... }',
                  '',
                  '#[test]',
                  'fn user_creation_requires_valid_email() { ... }',
                  '',
                  '#[test]',
                  'fn expired_token_is_rejected() { ... }',
              ),
              lines(
                  '#[test]',
                  'fn parse_returns_error_for_empty_input() { assert!(true); }',
                  '',
                  '#[test]',
                  'fn parse_handles_unicode_characters() { assert!(true); }',
                  '',
                  '#[test]',
                  'fn user_creation_requires_valid_email() { assert!(true); }',
                  '',
                  '#[test]',
                  'fn expired_token_is_rejected() { assert!(true); }',
              ),
          )

          # Give the `use super::*` example concrete parent items.
          replace('test-use-super.md', '<!-- rust-check: fragment; reason=extraction artifact: wrapper/context -->', '<!-- rust-check: compile -->')
          replace(
              'test-use-super.md',
              lines(
                  '// src/my_module.rs',
                  'pub struct PublicStruct { ... }',
                  'struct PrivateStruct { ... }  // Private',
                  '',
                  'pub fn public_function() -> i32 { ... }',
                  'fn private_helper() -> i32 { ... }  // Private',
              ),
              lines(
                  '// src/my_module.rs',
                  'pub struct PublicStruct;',
                  'impl PublicStruct { fn new() -> Self { Self } }',
                  '',
                  'struct PrivateStruct;  // Private',
                  'impl PrivateStruct { fn new() -> Self { Self } }',
                  '',
                  'pub fn public_function() -> i32 { 42 }',
                  'fn private_helper() -> i32 { 42 }  // Private',
              ),
          )
          replace('test-use-super.md', '        // ...', '        assert_eq!(std::mem::size_of_val(&s), 0);', count=2)

          # PhantomData example only needed a real function body.
          replace('type-phantom-marker.md', '<!-- rust-check: fragment; reason=extraction artifact: wrapper/context -->', '<!-- rust-check: compile -->')
          replace('type-phantom-marker.md', 'fn process_user(h: Handle<User>) { ... }', 'fn process_user(h: Handle<User>) { let _ = h; }')
          PY

      - name: Verify full Rust 1.98 corpus
        run: bash checks/check.sh

      - name: Show contract counts
        run: |
          cd checks
          python3 gen.py
          python3 - <<'PY'
          import json
          from collections import Counter
          c = Counter(x['expect'] for x in json.load(open('manifest.json')).values())
          print(' '.join(f'{k}={c[k]}' for k in sorted(c)))
          PY

      - name: Commit migration
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rules
          git commit -m 'Compile-check simple fragment examples'
          git push
