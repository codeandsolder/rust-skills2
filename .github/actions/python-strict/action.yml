name: rust-skills2 strict Python gate
description: Run the central Ruff + ty policy against every tracked Python file in the checkout.

inputs:
  ban-python-outside-ci:
    description: Reject tracked Python files outside recognized CI-only directories. Enabled by default.
    required: false
    default: "true"
  python-ci-paths:
    description: Additional repository-relative CI-only directory prefixes, one per line.
    required: false
    default: ""

outputs:
  has-python:
    description: Whether tracked Python files need Ruff and ty checking.
    value: ${{ steps.inventory.outputs.present }}

runs:
  using: composite
  steps:
    - name: Check tracked Python inventory and location policy
      id: inventory
      shell: bash
      env:
        RUST_SKILLS2_BAN_PYTHON_OUTSIDE_CI: ${{ inputs.ban-python-outside-ci }}
        RUST_SKILLS2_PYTHON_CI_PATHS: ${{ inputs.python-ci-paths }}
        RUST_SKILLS2_PYTHON_ACTION_DIR: ${{ github.action_path }}
      run: |
        set -euo pipefail
        present="$(bash "$GITHUB_ACTION_PATH/../../../scripts/strict_python.sh" --probe)"
        case "$present" in
          true|false) printf 'present=%s\n' "$present" >> "$GITHUB_OUTPUT" ;;
          *) echo "invalid Python inventory result: $present" >&2; exit 2 ;;
        esac

    - name: Install uv
      if: steps.inventory.outputs.present == 'true'
      uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      with:
        version: latest-known
        enable-cache: false

    - name: Run rust-skills2 strict Python policy
      if: steps.inventory.outputs.present == 'true'
      shell: bash
      env:
        RUST_SKILLS2_BAN_PYTHON_OUTSIDE_CI: ${{ inputs.ban-python-outside-ci }}
        RUST_SKILLS2_PYTHON_CI_PATHS: ${{ inputs.python-ci-paths }}
        RUST_SKILLS2_PYTHON_ACTION_DIR: ${{ github.action_path }}
      run: |
        bash "$GITHUB_ACTION_PATH/../../../scripts/strict_python.sh"
