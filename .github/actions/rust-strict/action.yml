name: rust-skills2 strict Rust gate
description: Run the central rust-skills2 strict nightly Rust policy against a checked-out Rust workspace.

inputs:
  working-directory:
    description: Rust workspace directory relative to the checkout root.
    required: false
    default: "."
  cargo-args:
    description: Space-separated Cargo selector arguments (package/features/target/target-kind/lock behavior).
    required: false
    default: "--locked --workspace --all-targets"
  allow-test-panics:
    description: Keep production targets strict, but relax panic-style lints for test and benchmark targets.
    required: false
    default: "false"
  preserve-rustc-wrapper:
    description: Preserve a caller-provided local/deterministic RUSTC_WRAPPER. Fails if requested without a wrapper.
    required: false
    default: "false"
  install-toolchain:
    description: Install latest nightly Clippy and rustfmt before running. Set false when the caller already installed them.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Install latest nightly Rust tools
      if: ${{ inputs.install-toolchain == 'true' }}
      uses: dtolnay/rust-toolchain@nightly
      with:
        components: clippy,rustfmt

    - name: Install uv
      uses: astral-sh/setup-uv@v10.2.0
      with:
        version: latest-known
        enable-cache: false

    - name: Show nightly toolchain
      shell: bash
      run: |
        rustc +nightly --version
        cargo +nightly --version
        cargo +nightly clippy --version
        rustfmt +nightly --version
        uv --version

    - name: Run rust-skills2 strict policy
      shell: bash
      env:
        RUST_SKILLS2_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        RUST_SKILLS2_CARGO_ARGS: ${{ inputs.cargo-args }}
        RUST_SKILLS2_ALLOW_TEST_PANICS: ${{ inputs.allow-test-panics }}
        RUST_SKILLS2_PRESERVE_RUSTC_WRAPPER: ${{ inputs.preserve-rustc-wrapper }}
      run: |
        bash "$GITHUB_ACTION_PATH/../../../scripts/strict_clippy.sh"
