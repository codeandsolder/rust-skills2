name: rust-skills2 strict Rust gate
description: Run the central rust-skills2 strict nightly Rust policy against a checked-out Rust workspace.

inputs:
  working-directory:
    description: Rust workspace directory relative to the checkout root.
    required: false
    default: "."
  cargo-args:
    description: Space-separated Cargo selector arguments (package/features/target/target-kind/lock behavior).
    required: false
    default: "--locked --workspace --all-targets"
  allow-test-panics:
    description: Default test/bench panic ergonomics for selected packages; package/workspace metadata may override it while production stays strict.
    required: false
    default: "false"
  rust-toolchain:
    description: Dated nightly candidate; defaults to the gate pin.
    required: false
    default: ""
  install-toolchain:
    description: Install selected nightly Clippy and rustfmt before running. Set false when the caller already installed them.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Resolve one quarantined compiler
      id: compiler
      uses: codeandsolder/ci-workflows/.github/actions/resolve-rust-toolchain@ce4bd1bad2f4b4f9296a2500ee7b5bf54b0aa337 # main
      with:
        rust-toolchain: ${{ inputs.rust-toolchain }}

    - name: Install selected nightly Rust tools
      if: ${{ inputs.install-toolchain == 'true' }}
      uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
      with:
        toolchain: ${{ steps.compiler.outputs.channel }}
        components: clippy,rustfmt

    - name: Install uv
      uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      with:
        version: latest-known
        enable-cache: false

    - name: Show nightly toolchain
      shell: bash
      env:
        STRICT_TOOLCHAIN: ${{ steps.compiler.outputs.channel }}
      run: |
        rustc "+$STRICT_TOOLCHAIN" --version
        cargo "+$STRICT_TOOLCHAIN" --version
        cargo "+$STRICT_TOOLCHAIN" clippy --version
        rustfmt "+$STRICT_TOOLCHAIN" --version
        uv --version

    - name: Run rust-skills2 strict policy
      shell: bash
      env:
        STRICT_TOOLCHAIN: ${{ steps.compiler.outputs.channel }}
        RUST_SKILLS2_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        RUST_SKILLS2_CARGO_ARGS: ${{ inputs.cargo-args }}
        RUST_SKILLS2_ALLOW_TEST_PANICS: ${{ inputs.allow-test-panics }}
      run: |
        bash "$GITHUB_ACTION_PATH/../../../scripts/strict_clippy.sh" --toolchain "$STRICT_TOOLCHAIN"
