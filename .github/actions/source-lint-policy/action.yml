name: rust-skills2 source lint policy
description: Validate handwritten Rust lint suppressions without running the full strict Clippy gate.

inputs:
  working-directory:
    description: Rust workspace directory relative to the checkout root.
    required: false
    default: "."
  install-toolchain:
    description: Install pinned nightly Clippy before checking source policy.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Resolve one quarantined compiler
      id: compiler
      uses: codeandsolder/ci-workflows/.github/actions/resolve-rust-toolchain@25d6a3701f7da8aaaf21821db2c49ead32fbdcf2 # main

    - name: Install pinned nightly Rust tools
      if: ${{ inputs.install-toolchain == 'true' }}
      uses: codeandsolder/ci-workflows/.github/actions/install-rust-toolchain@d1891d74fe986e8bcdd9a99781538a0b82484848 # job-local compiler selection
      with:
        toolchain: ${{ steps.compiler.outputs.channel }}
        components: clippy

    - name: Show nightly toolchain
      shell: bash
      run: |
        rustc "+${{ steps.compiler.outputs.channel }}" --version
        clippy-driver "+${{ steps.compiler.outputs.channel }}" --version

    - name: Check source lint suppression policy
      working-directory: ${{ inputs.working-directory }}
      shell: bash
      run: node "$GITHUB_ACTION_PATH/../../../policy-wasm/check.mjs" "$GITHUB_ACTION_PATH/../../../policy-wasm/module.json" "${{ steps.compiler.outputs.channel }}"
