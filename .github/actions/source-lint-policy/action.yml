name: rust-skills2 source lint policy
description: Validate handwritten Rust lint suppressions without running the full strict Clippy gate.

inputs:
  working-directory:
    description: Rust workspace directory relative to the checkout root.
    required: false
    default: "."
  install-toolchain:
    description: Install pinned nightly Clippy before checking source policy.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Resolve one quarantined compiler
      id: compiler
      uses: codeandsolder/ci-workflows/.github/actions/resolve-rust-toolchain@d7135459ef21e0edd32a725fa9334e0c57c9cd70 # main

    - name: Install pinned nightly Rust tools
      if: ${{ inputs.install-toolchain == 'true' }}
      uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
      with:
        toolchain: ${{ steps.compiler.outputs.channel }}
        components: clippy

    - name: Show nightly toolchain
      shell: bash
      run: |
        rustc "+${{ steps.compiler.outputs.channel }}" --version
        clippy-driver "+${{ steps.compiler.outputs.channel }}" --version

    - name: Check source lint suppression policy
      working-directory: ${{ inputs.working-directory }}
      shell: bash
      run: python3 "$GITHUB_ACTION_PATH/../../../scripts/check_source_lint_policy.py" --toolchain "${{ steps.compiler.outputs.channel }}"
